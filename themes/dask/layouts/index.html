{{ define "main" }}
<div class="container">
  <div class="page-header">
    <h1>{{ .Site.Title }}</h1>
    <p class="post-tagline">{{ .Site.Params.description }}</p>
  </div>
  <ul class="post-list">
    {{- range where .Site.RegularPages "Section" "posts" }}
    <li>
      <span class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></span>
      <div class="post-meta-line">
        <span class="post-date">{{ .Date.Format "January 2, 2006" }}</span>
        {{- with .Params.tags }}
        <span class="post-tags">
          {{- range . }}
          <a class="tag-pill" href="{{ "/tag/" | relURL }}{{ . | urlize }}/">{{ . }}</a>
          {{- end }}
        </span>
        {{- end }}
      </div>
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
