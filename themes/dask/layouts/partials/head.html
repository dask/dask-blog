<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>
  {{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{
  end }}
</title>
{{- partial "meta.html" . -}} <link rel="icon" type="image/png" href="{{
"favicon.png" | relURL }}"> <link rel="apple-touch-icon" href="{{
"apple-touch-icon.png" | relURL }}">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
/>
{{- $mainCSS := resources.Get "css/main.css" | minify | fingerprint }}
<link
  rel="stylesheet"
  href="{{ $mainCSS.RelPermalink }}"
  integrity="{{ $mainCSS.Data.Integrity }}"
/>
{{- $syntaxCSS := resources.Get "css/syntax.css" | minify | fingerprint }}
<link
  rel="stylesheet"
  href="{{ $syntaxCSS.RelPermalink }}"
  integrity="{{ $syntaxCSS.Data.Integrity }}"
/>
<link rel="alternate" type="application/atom+xml" title="{{ .Site.Title }}"
href="{{ "atom.xml" | absURL }}"> {{- if .Params.canonical_url }}
<link rel="canonical" href="{{ .Params.canonical_url }}" />
{{- else }}
<link rel="canonical" href="{{ .Permalink }}" />
{{- end }} {{- partial "math.html" . -}}
<script>
  (function () {
    var mode = localStorage.getItem("mode") || "auto";
    var theme =
      mode === "auto"
        ? window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light"
        : mode;
    document.documentElement.setAttribute("data-mode", mode);
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
