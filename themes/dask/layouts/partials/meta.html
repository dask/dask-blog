{{- $description := .Params.tagline | default .Params.description | default
.Site.Params.description -}}
<meta name="description" content="{{ $description }}" />
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:description" content="{{ $description }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:site_name" content="{{ .Site.Title }}" />
<meta
  property="og:type"
  content="{{ if .IsPage }}article{{ else }}website{{ end }}"
/>
{{- if .IsPage }} {{- if .Params.author }}
<meta property="article:author" content="{{ .Params.author }}" />
{{- end }} <meta property="article:published_time" content="{{ .Date.Format
"2006-01-02T15:04:05Z07:00" }}"> {{- end }}
