<button
  class="theme-toggle"
  id="theme-toggle"
  aria-label="Toggle theme"
  title="Toggle theme"
>
  <svg
    class="theme-icon"
    data-mode="light"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 576 512"
    width="18"
    height="18"
    fill="currentColor"
    aria-hidden="true"
  >
    <path
      d="M288 32c8.4 0 16.3 4.4 20.6 11.7l55.5 92.6 104.7-26.2c8.2-2 16.9.4 22.8 6.3s8.3 14.6 6.3 22.8L471.7 244.1l92.6 55.5c7.2 4.3 11.7 12.2 11.7 20.6s-4.4 16.3-11.7 20.6l-92.6 55.5 26.2 104.7c2 8.2-.4 16.9-6.3 22.8s-14.6 8.3-22.8 6.3l-104.7-26.3-55.5 92.7c-4.3 7.2-12.2 11.7-20.6 11.7s-16.3-4.4-20.6-11.7l-55.5-92.7-104.7 26.3c-8.2 2-16.9-.4-22.8-6.3s-8.3-14.6-6.3-22.8l26.2-104.7-92.6-55.5C4.4 336.2 0 328.4 0 320s4.4-16.3 11.7-20.6l92.6-55.5L78 139.2c-2-8.2.4-16.9 6.3-22.8s14.6-8.3 22.8-6.3l104.7 26.2 55.5-92.6C271.7 36.4 279.6 32 288 32zm0 144a144 144 0 1 0 0 288 144 144 0 1 0 0-288zm0 240a96 96 0 1 1 0-192 96 96 0 1 1 0 192z"
    />
  </svg>
  <svg
    class="theme-icon"
    data-mode="dark"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 384 512"
    width="18"
    height="18"
    fill="currentColor"
    aria-hidden="true"
  >
    <path
      d="M223.5 32C100 32 0 132.3 0 256s100 224 223.5 224c60.6 0 115.5-21.4 158.1-57.7 5.3-4.5 6.7-11.8 3.5-17.8s-10.1-9.2-16.6-8.4c-4.1.5-8.3.7-12.5.7-79.8 0-144.5-66.5-144.5-148.5S276.2 99.8 356 99.8c4.2 0 8.4.2 12.5.7 6.5.8 12.8-2.4 16-8.4s1.8-13.3-3.5-17.8C338.5 53.4 284.1 32 223.5 32z"
    />
  </svg>
  <svg
    class="theme-icon"
    data-mode="auto"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    width="18"
    height="18"
    fill="currentColor"
    aria-hidden="true"
  >
    <path
      d="M448 256c0-106-86-192-192-192l0 384c106 0 192-86 192-192zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256z"
    />
  </svg>
</button>
<script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    var icons = btn.querySelectorAll(".theme-icon");
    var mql = window.matchMedia("(prefers-color-scheme: dark)");

    var titles = { light: "Light", dark: "Dark", auto: "System" };

    function getMode() {
      return localStorage.getItem("mode") || "auto";
    }

    function resolveTheme(mode) {
      if (mode === "auto") return mql.matches ? "dark" : "light";
      return mode;
    }

    function apply(mode) {
      var theme = resolveTheme(mode);
      document.documentElement.setAttribute("data-mode", mode);
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("mode", mode);
      localStorage.setItem("theme", theme);
      btn.setAttribute("title", titles[mode]);
      btn.setAttribute("aria-label", "Theme: " + titles[mode]);
      icons.forEach(function (icon) {
        icon.style.display =
          icon.getAttribute("data-mode") === mode ? "block" : "none";
      });
    }

    function cycleMode() {
      var current = getMode();
      var prefersDark = mql.matches;
      var order = prefersDark
        ? ["auto", "light", "dark"]
        : ["auto", "dark", "light"];
      var idx = order.indexOf(current);
      var next = order[(idx + 1) % 3];
      apply(next);
    }

    // Apply on load
    apply(getMode());

    // Listen for clicks
    btn.addEventListener("click", cycleMode);

    // Listen for system theme changes when in auto mode
    mql.addEventListener("change", function () {
      if (getMode() === "auto") apply("auto");
    });
  })();
</script>
